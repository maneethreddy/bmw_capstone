name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Java 17 is required for PySpark 3.5.x (Java 11 or 17 supported)
      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q src tests api

      - name: Run tests
        run: pytest -v
        env:
          # Explicitly point PySpark at the Java 17 runtime set up above
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
